name: Bug report
description: Something looks broken or wrong on the website
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you saw, and your device and browser.
    validations:
      required: true
