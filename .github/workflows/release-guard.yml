name: Release guard

# Production (main) only accepts release PRs from `staging`, or emergency `hotfix/*` branches.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-source:
    name: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests from forks must target the staging branch, not main."; exit 1
          fi
          case "$HEAD_REF" in
            staging|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "::error::Only 'staging' (releases) or 'hotfix/*' (emergencies) can merge into main. Open your pull request against 'staging' instead."; exit 1 ;;
          esac
