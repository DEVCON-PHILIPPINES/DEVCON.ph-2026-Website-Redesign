name: Deploy staging (GitHub Pages)

# staging-: https://devcon-philippines.github.io/staging-devcon-ph-2026-website-redesign/
# Every merge into `staging` publishes here for HQ review before release. Staging is kept out of search results.
on:
  push:
    branches: [staging]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: site-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_site.py

  deploy:
    name: Deploy to staging
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.gh.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare staging copy (noindex)
        run: |
          rm -rf _site && cp -r docs _site
          rm -f _site/_headers _site/_redirects
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          find _site -name '*.html' -print0 | xargs -0 sed -i 's#<meta charset="utf-8"/>#<meta charset="utf-8"/>\n<meta name="robots" content="noindex, nofollow"/>#'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: gh
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify staging
        env:
          STG_URL: ${{ steps.gh.outputs.page_url }}
        run: |
          expected=$(grep -o '<meta name="version" content="[^"]*"' docs/index.html | head -1 | sed 's/.*content="//;s/"//')
          for i in $(seq 1 20); do
            v=$(curl -s -A "Mozilla/5.0 (DEVCON staging check)" "${STG_URL}?v=$RANDOM" | grep -o '<meta name="version" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"//')
            [ "$v" = "$expected" ] && { echo "Staging is live: $STG_URL ($v)"; exit 0; }
            sleep 15
          done
          echo "::error::Staging serves '$v', expected '$expected'"; exit 1
