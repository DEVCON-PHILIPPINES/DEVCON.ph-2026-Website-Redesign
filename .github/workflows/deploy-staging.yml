name: Deploy staging (Cloudflare Pages preview)

# Every merge into `staging` publishes to the stable staging URL for HQ review before release.
on:
  push:
    branches: [staging]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  check:
    name: site-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_site.py

  deploy:
    name: Deploy to staging
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.${{ vars.CLOUDFLARE_PROJECT }}.pages.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy to Cloudflare Pages (staging alias)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name "${{ vars.CLOUDFLARE_PROJECT }}" \
            --branch staging \
            --commit-hash "${{ github.sha }}" \
            --commit-message "$(git log -1 --pretty=%s | head -c 300)" \
            --commit-dirty=true
      - name: Verify staging serves this version
        run: |
          expected=$(grep -o '<meta name="version" content="[^"]*"' docs/index.html | head -1 | sed 's/.*content="//;s/"//')
          url="https://staging.${{ vars.CLOUDFLARE_PROJECT }}.pages.dev/"
          for i in $(seq 1 20); do
            v=$(curl -s -A "Mozilla/5.0 (DEVCON staging check)" "$url?v=$RANDOM" | grep -o '<meta name="version" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"//')
            [ "$v" = "$expected" ] && { echo "Staging is live: $url ($v)"; exit 0; }
            sleep 10
          done
          echo "::error::Staging is serving '$v', expected '$expected'"; exit 1
