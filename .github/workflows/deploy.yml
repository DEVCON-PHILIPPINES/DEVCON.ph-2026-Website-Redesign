name: Deploy production (Cloudflare Pages)

# prod-: https://prod-devcon-ph-2026-website-redesign.pages.dev
# Runs when a release PR (staging -> main) or hotfix merges. An HQ leader must approve the `production` environment.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    name: site-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_site.py

  deploy:
    name: Deploy to production
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.CLOUDFLARE_PROJECT }}.pages.dev/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs \
            --project-name "${{ vars.CLOUDFLARE_PROJECT }}" \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-message "$(git log -1 --pretty=%s | head -c 300)" \
            --commit-dirty=true
      - name: Verify production
        env:
          PROD_URL: https://${{ vars.CLOUDFLARE_PROJECT }}.pages.dev
        run: |
          UA="Mozilla/5.0 (DEVCON deploy check)"
          expected=$(grep -o '<meta name="version" content="[^"]*"' docs/index.html | head -1 | sed 's/.*content="//;s/"//')
          for i in $(seq 1 20); do
            v=$(curl -s -A "$UA" "$PROD_URL/?v=$RANDOM" | grep -o '<meta name="version" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"//')
            [ "$v" = "$expected" ] && break; sleep 10
          done
          [ "$v" = "$expected" ] || { echo "::error::Production serves '$v', expected '$expected'"; exit 1; }
          fail=0
          for p in $(python3 -c "import json;print(' '.join(json.load(open('docs/url-map.json'))['pages']))"); do
            code=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' "$PROD_URL$p"); [ "$code" = "200" ] || { echo "::error::$p returned $code"; fail=1; }
          done
          [ $fail = 0 ] && echo "Production is live: $PROD_URL ($v), all pages 200."
          exit $fail
